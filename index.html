
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My CRUD App</title>
  <style>
    body {
      font-family: Arial;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f0f4f8;
    }
    input, button {
      padding: 10px;
      margin: 5px;
    }
    .post {
      background: white;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>My CRUD App</h1>

  <input id="postInput" placeholder="Write your post">
  <button onclick="addPost()">Add Post</button>

  <div id="posts"></div>

  <script>
    let posts = JSON.parse(localStorage.getItem("posts") || "[]");

    function save() {
      localStorage.setItem("posts", JSON.stringify(posts));
      showPosts();
    }

    function addPost() {
      const input = document.getElementById("postInput");
      if (!input.value.trim()) return alert("Write a post first!");

      posts.push(input.value.trim());
      input.value = "";
      save();
    }

    function showPosts() {
      const container = document.getElementById("posts");
      container.replaceChildren();

      posts.forEach((post, i) => {
        const div = document.createElement("div");
        div.className = "post";

        const text = document.createElement("p");
        text.textContent = post;

        const edit = document.createElement("button");
        edit.textContent = "Edit";
        edit.onclick = () => {
          const updated = prompt("Edit post:", posts[i]);
          if (updated !== null && updated.trim()) {
            posts[i] = updated.trim();
            save();
          }
        };

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = () => {
          if (confirm("Delete this post?")) {
            posts.splice(i, 1);
            save();
          }
        };

        div.append(text, edit, del);
        container.appendChild(div);
      });
    }

    showPosts();
  </script>
</body>
</html>
